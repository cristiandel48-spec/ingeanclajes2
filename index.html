<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Iconos: recortes del logo real (src/assets/logo-ingeanclajes.jpeg).
         El favicon lleva solo el monograma «ia» porque a 16-32 px la
         palabra INGEANCLAJES no se alcanza a leer. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- viewport-fit=cover permite usar env(safe-area-inset-*) en iPhone.
         maximum-scale se omite a proposito: limitarlo impide el zoom
         a personas con baja vision. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14151a" />
    <meta name="description" content="Sistema de gestión comercial, técnica y operativa de Ingeanclajes S.A.S." />
    <!-- Permite instalar la app en la pantalla de inicio del iPhone. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ingeanclajes" />
    <title>Ingeanclajes · Sistema de gestión</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
