<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2029"/>
      <stop offset="100%" stop-color="#0f1015"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle border highlight -->
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Logo Emblem: Ingeanclajes Red Anchor/Wing -->
  <g transform="translate(256, 210) scale(1.6)" filter="url(#shadow)">
    <!-- Central downward anchor wedge -->
    <path d="M -18,-15 L 18,-15 L 14,20 C 8,50 0,65 0,65 C 0,65 -8,50 -14,20 Z" fill="url(#redGrad)"/>
    
    <!-- Top central bar -->
    <path d="M -35,-32 L 35,-32 L 30,-18 L -30,-18 Z" fill="url(#redGrad)"/>
    
    <!-- Left wing -->
    <path d="M -35,-18 L -18,-18 C -14,10 -2,35 -2,35 C -15,22 -35,5 -52,-10 L -35,-18 Z" fill="url(#redGrad)"/>
    <!-- Left outer wing tip -->
    <path d="M -38,-32 L -88,-32 C -92,-32 -95,-30 -88,-25 L -42,-18 L -34,-18 Z" fill="url(#redGrad)"/>
    
    <!-- Right wing -->
    <path d="M 35,-18 L 18,-18 C 14,10 2,35 2,35 C 15,22 35,5 52,-10 L 35,-18 Z" fill="url(#redGrad)"/>
    <!-- Right outer wing tip -->
    <path d="M 38,-32 L 88,-32 C 92,-32 95,-30 88,-25 L 42,-18 L 34,-18 Z" fill="url(#redGrad)"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="385" font-family="'Segoe UI', -apple-system, 'Inter', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">
    INGE<tspan fill="#ef4444">ANCLAJES</tspan>
  </text>
  <text x="256" y="420" font-family="'Segoe UI', -apple-system, 'Inter', Roboto, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" letter-spacing="6" text-anchor="middle">
    SEGURIDAD EN ALTURAS
  </text>
</svg>
