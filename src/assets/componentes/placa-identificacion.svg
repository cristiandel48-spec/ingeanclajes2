  <!-- Nota al pie de placa -->
  <text x="450" y="470" font-size="11" font-weight="700" fill="#3a4048" text-anchor="middle" letter-spacing="0.05em">
    ACERO INOXIDABLE GRABADO LÁSER · REGISTRO Y CONTROL DE INSPECCIÓN ANUAL OBLIGATORIA
