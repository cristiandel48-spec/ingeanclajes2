      <rect x="65" y="0" width="65" height="22" class="bdr-box"/><text x="97.5" y="16" class="txt-tbl">FEB</text>
      <rect x="130" y="0" width="65" height="22" class="bdr-box"/><text x="162.5" y="16" class="txt-tbl">MAR</text>
      <rect x="195" y="0" width="65" height="22" class="bdr-box"/><text x="227.5" y="16" class="txt-tbl">ABR</text>
      <rect x="260" y="0" width="65" height="22" class="bdr-box"/><text x="292.5" y="16" class="txt-tbl">MAY</text>
      <rect x="325" y="0" width="65" height="22" class="bdr-box"/><text x="357.5" y="16" class="txt-tbl">JUN</text>
      <rect x="390" y="0" width="65" height="22" class="bdr-box"/><text x="422.5" y="16" class="txt-tbl">JUL</text>
      <rect x="455" y="0" width="65" height="22" class="bdr-box"/><text x="487.5" y="16" class="txt-tbl">AGOS</text>
      <rect x="520" y="0" width="65" height="22" class="bdr-box"/><text x="552.5" y="16" class="txt-tbl">SEPT</text>
      <rect x="585" y="0" width="65" height="22" class="bdr-box"/><text x="617.5" y="16" class="txt-tbl">OCT</text>
      <rect x="650" y="0" width="65" height="22" class="bdr-box"/><text x="682.5" y="16" class="txt-tbl">NOV</text>
      <rect x="715" y="0" width="65" height="22" class="bdr-box"/><text x="747.5" y="16" class="txt-tbl">DIC</text>
      <!-- Perforación mes septiembre troquelada -->
      <circle cx="552.5" cy="11" r="6" fill="#1c2024" opacity="0.85"/>
      <circle cx="552.5" cy="11" r="4.5" fill="#5c2020"/>

      <!-- Años 2024 a 2035 -->
      <g transform="translate(0, 22)">
        <rect x="0" y="0" width="65" height="22" class="bdr-box"/><text x="32.5" y="16" class="txt-tbl">2024</text>
        <rect x="65" y="0" width="65" height="22" class="bdr-box"/><text x="97.5" y="16" class="txt-tbl">2025</text>
        <rect x="130" y="0" width="65" height="22" class="bdr-box"/><text x="162.5" y="16" class="txt-tbl">2026</text>
        <rect x="195" y="0" width="65" height="22" class="bdr-box"/><text x="227.5" y="16" class="txt-tbl">2027</text>
        <rect x="260" y="0" width="65" height="22" class="bdr-box"/><text x="292.5" y="16" class="txt-tbl">2028</text>
        <rect x="325" y="0" width="65" height="22" class="bdr-box"/><text x="357.5" y="16" class="txt-tbl">2029</text>
        <rect x="390" y="0" width="65" height="22" class="bdr-box"/><text x="422.5" y="16" class="txt-tbl">2030</text>
        <rect x="455" y="0" width="65" height="22" class="bdr-box"/><text x="487.5" y="16" class="txt-tbl">2031</text>
        <rect x="520" y="0" width="65" height="22" class="bdr-box"/><text x="552.5" y="16" class="txt-tbl">2032</text>
        <rect x="585" y="0" width="65" height="22" class="bdr-box"/><text x="617.5" y="16" class="txt-tbl">2033</text>
        <rect x="650" y="0" width="65" height="22" class="bdr-box"/><text x="682.5" y="16" class="txt-tbl">2034</text>
        <rect x="715" y="0" width="65" height="22" class="bdr-box"/><text x="747.5" y="16" class="txt-tbl">2035</text>
        <!-- Perforación año 2026 troquelada -->
        <circle cx="162.5" cy="11" r="6" fill="#1c2024" opacity="0.85"/>
        <circle cx="162.5" cy="11" r="4.5" fill="#5c2020"/>
      </g>
    </g>
  </g>

  <!-- TABLA 2: FECHA DE CERTIFICACIÓN -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="780" height="22" fill="#d9dde3" class="bdr-box"/>
    <text x="390" y="16" class="txt-lbl" text-anchor="middle">FECHA DE CERTIFICACIÓN</text>
    
    <!-- 12 Meses -->
    <g transform="translate(0, 22)">
      <rect x="0" y="0" width="65" height="22" class="bdr-box"/><text x="32.5" y="16" class="txt-tbl">ENE</text>
      <rect x="65" y="0" width="65" height="22" class="bdr-box"/><text x="97.5" y="16" class="txt-tbl">FEB</text>
      <rect x="130" y="0" width="65" height="22" class="bdr-box"/><text x="162.5" y="16" class="txt-tbl">MAR</text>
      <rect x="195" y="0" width="65" height="22" class="bdr-box"/><text x="227.5" y="16" class="txt-tbl">ABR</text>
      <rect x="260" y="0" width="65" height="22" class="bdr-box"/><text x="292.5" y="16" class="txt-tbl">MAY</text>
      <rect x="325" y="0" width="65" height="22" class="bdr-box"/><text x="357.5" y="16" class="txt-tbl">JUN</text>
      <rect x="390" y="0" width="65" height="22" class="bdr-box"/><text x="422.5" y="16" class="txt-tbl">JUL</text>
      <rect x="455" y="0" width="65" height="22" class="bdr-box"/><text x="487.5" y="16" class="txt-tbl">AGOS</text>
      <rect x="520" y="0" width="65" height="22" class="bdr-box"/><text x="552.5" y="16" class="txt-tbl">SEPT</text>
      <rect x="585" y="0" width="65" height="22" class="bdr-box"/><text x="617.5" y="16" class="txt-tbl">OCT</text>
      <rect x="650" y="0" width="65" height="22" class="bdr-box"/><text x="682.5" y="16" class="txt-tbl">NOV</text>
      <rect x="715" y="0" width="65" height="22" class="bdr-box"/><text x="747.5" y="16" class="txt-tbl">DIC</text>

      <!-- Años 2024 a 2035 -->
      <g transform="translate(0, 22)">
        <rect x="0" y="0" width="65" height="22" class="bdr-box"/><text x="32.5" y="16" class="txt-tbl">2024</text>
        <rect x="65" y="0" width="65" height="22" class="bdr-box"/><text x="97.5" y="16" class="txt-tbl">2025</text>
        <rect x="130" y="0" width="65" height="22" class="bdr-box"/><text x="162.5" y="16" class="txt-tbl">2026</text>
        <rect x="195" y="0" width="65" height="22" class="bdr-box"/><text x="227.5" y="16" class="txt-tbl">2027</text>
        <rect x="260" y="0" width="65" height="22" class="bdr-box"/><text x="292.5" y="16" class="txt-tbl">2028</text>
        <rect x="325" y="0" width="65" height="22" class="bdr-box"/><text x="357.5" y="16" class="txt-tbl">2029</text>
        <rect x="390" y="0" width="65" height="22" class="bdr-box"/><text x="422.5" y="16" class="txt-tbl">2030</text>
        <rect x="455" y="0" width="65" height="22" class="bdr-box"/><text x="487.5" y="16" class="txt-tbl">2031</text>
        <rect x="520" y="0" width="65" height="22" class="bdr-box"/><text x="552.5" y="16" class="txt-tbl">2032</text>
        <rect x="585" y="0" width="65" height="22" class="bdr-box"/><text x="617.5" y="16" class="txt-tbl">2033</text>
        <rect x="650" y="0" width="65" height="22" class="bdr-box"/><text x="682.5" y="16" class="txt-tbl">2034</text>
        <rect x="715" y="0" width="65" height="22" class="bdr-box"/><text x="747.5" y="16" class="txt-tbl">2035</text>
      </g>
